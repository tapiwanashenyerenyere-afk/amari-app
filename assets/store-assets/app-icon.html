<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 512px;
    height: 512px;
    overflow: hidden;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  /* Subtle grain texture */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 128px 128px;
    opacity: 0.5;
    pointer-events: none;
    z-index: 1;
  }
  /* Subtle radial warmth */
  body::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 40% 35%, rgba(201,169,98,0.08) 0%, transparent 60%);
    z-index: 1;
    pointer-events: none;
  }
  .icon-container {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
  }
</style>
</head>
<body>
  <div class="icon-container">
    <svg width="340" height="340" viewBox="0 0 340 340" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Rounded rectangle background -->
      <rect x="10" y="10" width="320" height="320" rx="48" fill="#f8f6f3"/>

      <!-- The stylized A monogram -->
      <g transform="translate(170, 170)">
        <!-- Left stroke of A - thick diagonal from bottom-left to top-center -->
        <path d="M-80 100 L-10 -100 L10 -100 L-50 100 Z" fill="#1a1a1a"/>

        <!-- Right stroke of A - thick diagonal from top-center to bottom-right -->
        <path d="M-2 -100 L18 -100 L90 100 L60 100 Z" fill="#1a1a1a"/>

        <!-- Diagonal slash line - thin, from upper-left to lower-right -->
        <line x1="-70" y1="-80" x2="80" y2="90" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>

        <!-- Crossbar negative space (cut through the A) -->
        <rect x="-55" y="10" width="100" height="5" fill="#f8f6f3" transform="rotate(-3)"/>
      </g>
    </svg>
  </div>
</body>
</html>
