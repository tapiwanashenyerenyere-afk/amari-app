name: EAS Submit

on:
  workflow_dispatch:
    inputs:
      submit_profile:
        description: 'Submit profile'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - production
      build_id:
        description: 'Optional EAS build ID to submit'
        required: false
        type: string

jobs:
  submit:
    name: Submit Android Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Decode Google Play service account
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 secret."
            exit 1
          fi

          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 -d > google-services.json

      - name: Submit latest build
        if: github.event.inputs.build_id == ''
        run: eas submit --platform android --profile ${{ github.event.inputs.submit_profile }} --latest --non-interactive

      - name: Submit selected build
        if: github.event.inputs.build_id != ''
        run: eas submit --platform android --profile ${{ github.event.inputs.submit_profile }} --id ${{ github.event.inputs.build_id }} --non-interactive
