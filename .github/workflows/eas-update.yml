name: EAS Update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'EAS Update channel'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      platform:
        description: 'Platform to publish'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - all
      message:
        description: 'Update message'
        required: true
        type: string

jobs:
  update:
    name: Publish OTA Update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish update
        run: eas update --channel ${{ github.event.inputs.channel }} --platform ${{ github.event.inputs.platform }} --message "${{ github.event.inputs.message }}" --non-interactive
