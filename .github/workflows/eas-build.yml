name: EAS Build
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: EAS Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Setup Android Keystore
        if: github.event.inputs.profile == 'production'
        run: |
          # Decode the base64 keystore from secrets
          echo "$KEYSTORE_BASE64" | base64 -d > amari-upload.jks

          # Create credentials.json for EAS local credentials
          cat > credentials.json <<CREDS
          {
            "android": {
              "keystore": {
                "keystorePath": "./amari-upload.jks",
                "keystorePassword": "$KEYSTORE_PASSWORD",
                "keyAlias": "amari-key",
                "keyPassword": "$KEYSTORE_PASSWORD"
              }
            }
          }
          CREDS
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Force local Android signing for production
        if: github.event.inputs.profile == 'production'
        run: |
          node -e "const fs=require('fs'); const path='eas.json'; const eas=JSON.parse(fs.readFileSync(path,'utf8')); eas.build.production=eas.build.production||{}; eas.build.production.android={...(eas.build.production.android||{}),credentialsSource:'local'}; fs.writeFileSync(path, JSON.stringify(eas, null, 2) + '\n');"

      - name: Build
        run: eas build --platform android --profile ${{ github.event.inputs.profile }} --non-interactive --wait --json > build.json

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: eas-build-metadata-${{ github.event.inputs.profile }}
          path: build.json
          retention-days: 7

      - name: Download signed Android artifact
        if: github.event.inputs.profile == 'production'
        shell: bash
        run: |
          BUILD_URL=$(node -e "const fs=require('fs'); const raw=fs.readFileSync('build.json','utf8'); const start=raw.indexOf('{'); const end=raw.lastIndexOf('}'); if (start === -1 || end === -1 || end < start) process.exit(1); const data=JSON.parse(raw.slice(start, end + 1)); process.stdout.write(data.artifacts?.applicationArchiveUrl || data.artifacts?.buildUrl || '');")
          if [ -z "$BUILD_URL" ]; then
            echo "Missing application archive URL in build.json"
            cat build.json
            exit 1
          fi
          curl -L "$BUILD_URL" -o amari-production-signed.aab

      - name: Upload signed Android artifact
        if: github.event.inputs.profile == 'production'
        uses: actions/upload-artifact@v4
        with:
          name: amari-production-signed-aab
          path: amari-production-signed.aab
          retention-days: 7
